# docker-compose.yml - Rakuten MLOps Full Stack (WITH SSH)
# 
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose logs -f api-train  # View logs
#   docker-compose exec git-runner bash  # Enter shell

services:
  # ============================================================================
  # API Gateway (Main Entry Point)
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-gateway
    command: ["uvicorn", "mlops_rakuten.services.gateway_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - rakuten_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [rakuten-net]
    restart: unless-stopped
    depends_on:
      api-predict:
        condition: service_healthy
      api-ingest:
        condition: service_healthy
      api-train:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - PYTHONUNBUFFERED=1
    env_file: .env

  # ============================================================================
  # API: Data Ingestion
  # ============================================================================
  api-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-ingest
    command: ["uvicorn", "mlops_rakuten.services.ingest_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app                              # ✅ Code + Data depuis local
      - rakuten_logs:/app/logs
      - ./dvc.lock:/app/dvc.lock
      - /var/run/docker.sock:/var/run/docker.sock
      - rakuten_dvc_cache:/app/.dvc/cache   # ✅ Cache DVC persistent
      - ~/.ssh:/root/.ssh               # ✅ SSH keys for Git push
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env

  # ============================================================================
  # API: Model Training
  # ============================================================================
  api-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-train
    command: ["uvicorn", "mlops_rakuten.services.train_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app                              # ✅ Code + Data depuis local
      - rakuten_models:/app/models          # ✅ Models persistent
      - rakuten_reports:/app/reports        # ✅ Reports persistent
      - rakuten_logs:/app/logs
      - ./dvc.lock:/app/dvc.lock
      - /var/run/docker.sock:/var/run/docker.sock
      - rakuten_dvc_cache:/app/.dvc/cache   # ✅ Cache DVC persistent
      - ~/.ssh:/root/.ssh              # ✅ SSH keys for Git push
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME}
    env_file: .env

  # ============================================================================
  # API: Model Prediction
  # ============================================================================
  api-predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-predict
    command: ["uvicorn", "mlops_rakuten.services.predict_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app                              # ✅ Code depuis local
      - rakuten_models:/app/models          # ✅ Models (lecture)
      - rakuten_reports:/app/reports        # ✅ Reports (lecture)
      - rakuten_logs:/app/logs
      - ./dvc.lock:/app/dvc.lock
      - /var/run/docker.sock:/var/run/docker.sock
      - rakuten_dvc_cache:/app/.dvc/cache   # ✅ Cache DVC persistent
    networks: [rakuten-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env

  # ============================================================================
  # DVC Runner (Data Versioning & Pipeline Orchestration)
  # ============================================================================
  dvc-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-dvc-runner
    working_dir: /app
    command: ["sleep", "infinity"]  # Keep running for manual execution
    volumes:
      - .:/app                              # ✅ Code + Data + Config
      - rakuten_dvc_cache:/app/.dvc/cache   # ✅ Cache DVC persistent
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh              # ✅ SSH keys for Git push
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}           # 🔥 AJOUTER
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME} # 🔥 AJOUTER
      - MLFLOW_TRACKING_PASSWORD=${DAGSHUB_TOKEN}            # 🔥 AJOUTER
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Git Runner (Git Operations for sync_git_dvc)
  # ============================================================================
  git-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-git-runner
    working_dir: /app
    command: ["/bin/bash"]  # Interactive shell for git operations
    volumes:
      - .:/app                            
      - rakuten_dvc_cache:/app/.dvc/cache   
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh              # ✅ SSH keys for Git push
    networks: [rakuten-net]
    restart: "no"
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DAGSHUB_USER=${DAGSHUB_USER}
      - DAGSHUB_REPO=${DAGSHUB_REPO}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN}
    env_file: .env
    stdin_open: true
    tty: true

  # ============================================================================
  # Nginx (Reverse Proxy)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    #image: nginx:alpine
    container_name: rakuten-nginx
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/certs:/etc/nginx/certs:ro
    networks: [rakuten-net]
    restart: unless-stopped

  # ============================================================================
  # Monitoring: Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rakuten-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rakuten_prometheus_data:/prometheus
    networks: [rakuten-net]
    restart: unless-stopped

  # ============================================================================
  # Monitoring: Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: rakuten-grafana
    ports:
      - "3000:3000"
    volumes:
      - rakuten_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks: [rakuten-net]
    restart: unless-stopped

# ============================================================================
# Volumes (Named volumes for persistence)
# ============================================================================

volumes:
  rakuten_models:
    name: rakuten_models
  rakuten_reports:
    name: rakuten_reports
  rakuten_dvc_cache:      
    name: rakuten_dvc_cache
  rakuten_logs:
    name: rakuten_logs
  rakuten_prometheus_data:
    name: rakuten_prometheus_data
  rakuten_grafana_data:
    name: rakuten_grafana_data

# ============================================================================
# Networks
# ============================================================================

networks:
  rakuten-net:
    driver: bridge