data_seeding:
  # Fichiers d'entrée / sortie
  x_train_filename: "X_train_update.csv"
  y_train_filename: "Y_train_CVw08PX.csv"
  output_full_dataset_filename: "rakuten_dataset_full.csv"
  output_remainder_dataset_filename: "rakuten_dataset_remainder.csv"
  output_dataset_filename: "rakuten_train.csv"

  # colonnes
  text_column: "designation"
  target_column: "prdtypecode"

  # règles sur les batchs de seed
  batch_size: 1000
  n_batches: 10


data_ingestion:
  # Fichier d'entrée / sortie
  train_filename: "rakuten_train.csv"

  # colonnes
  text_column: "designation"
  target_column: "prdtypecode"


data_preprocessing:
  # Fichiers d'entrée / sortie
  input_dataset_filename: "rakuten_train.csv"
  output_dataset_filename: "preprocessed_dataset.csv"

  # colonnes
  text_column: "designation"
  target_column: "prdtypecode"

  # nettoyage basique
  drop_na_text: true
  drop_na_target: true
  drop_duplicates: true

  # règles sur les outliers de texte
  min_char_length: 10  # trop court → on supprime
  max_char_length: 200  # trop long → on supprime ou tronque
  min_alpha_ratio: 0.2  # au moins 20% de lettres dans le texte


data_transformation:
  # Fichiers d'entrée / sortie
  input_dataset_filename: "preprocessed_dataset.csv"

  # colonnes
  text_column: "designation"
  target_column: "prdtypecode"

  # Split train / validation
  test_size: 0.2
  random_state: 42
  stratify: true

  # TF-IDF vectorizer
  max_features: 20000
  ngram_min: 1
  ngram_max: 2
  lowercase: true
  stop_words: "english"  # null possible

  # Label encoding
  label_encoder_filename: "label_encoder.pkl"
  class_mapping_filename: "class_mapping.json"

  # Artefacts vectorisation
  vectorizer_filename: "tfidf_vectorizer.pkl"
  X_train_filename: "X_train_tfidf.npz"
  X_val_filename: "X_val_tfidf.npz"
  y_train_filename: "y_train.npy"
  y_val_filename: "y_val.npy"


model_trainer:
  # Où stocker le modèle entraîné
  model_filename: "text_classifier.pkl"

  # Chemins vers les données transformées
  X_train_filename: "X_train_tfidf.npz"
  y_train_filename: "y_train.npy"

  # Type de modèle
  model_type: "logistic_regression"  # au lieu de "linear_svc"

  # Hyperparamètres du modèle
  C: 1.0
  max_iter: 2000
  use_class_weight: true     # "balanced" si true, ré-équilibrage des classes


model_evaluation:
  # Chemin vers le modèle entraîné
  model_filename: "text_classifier.pkl"

  # Chemins vers les données de validation transformées
  X_val_filename: "X_val_tfidf.npz"
  y_val_filename: "y_val.npy"

  # Fichiers de sortie pour les résultats de validation
  metrics_filename: "metrics_val.json"
  classification_report_filename: "classification_report_val.txt"
  confusion_matrix_filename: "confusion_matrix_val.txt"


prediction:
  # Artefacts nécessaires
  vectorizer_filename: "tfidf_vectorizer.pkl"
  label_encoder_filename: "label_encoder.pkl"
  model_filename: "text_classifier.pkl"

  # Colonnes / champs
  text_column: "designation"

  # mapping prdtypecode -> category_name
  categories_filename: "product_categories.csv"
  category_code_column: "prdtypecode"
  category_name_column: "category_name"